[package]
name = "uds2sovd-proxy"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/eclipse-opensovd/uds2sovd-proxy"

[lints]
workspace = true

[workspace.dependencies]
# ---- async runtime ----
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false }
# ---- serialization ----
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
toml = { version = "0.9", default-features = false }
# ---- tracing & logging ----
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
# ---- error handling ----
thiserror = { version = "2.0", default-features = false }
anyhow = { version = "1.0", default-features = false }
# ---- data structures ----
bytes = { version = "1.0", default-features = false }
parking_lot = { version = "0.12", default-features = false }
# ---- utility crates ----
hex = { version = "0.4", default-features = false }
clap = { version = "4.4", default-features = false, features = ["std"] }
async-trait = { version = "0.1", default-features = false }
# ---- networking crates ----
reqwest = { version = "0.12", default-features = false }

cda-core = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "cf7fd9c18a7c49467e9e6c9ceae1e771c613e49b" }
cda-database = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "cf7fd9c18a7c49467e9e6c9ceae1e771c613e49b" }
cda-interfaces = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "cf7fd9c18a7c49467e9e6c9ceae1e771c613e49b" }
cda-plugin-security = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "cf7fd9c18a7c49467e9e6c9ceae1e771c613e49b" }

# Lints are aligned with shared-lints.toml from:
# https://github.com/eclipse-opensovd/cicd-workflows/tree/main/shared-lints
[workspace.lints.clippy]
# enable pedantic
pedantic = { level = "warn", priority = -1 }
## exclude some too pedantic lints for now
similar_names = "allow"

## lints related to runtime panic behavior
# enforce only checked access to slices to avoid runtime panics
indexing_slicing = "deny"
# disallow any unwraps in the production code
# (unwrap in test code is explicitly allowed)
unwrap_used = "deny"
# enforce that arithmetic operations that can produce side effects always use
# either checked or explicit versions of the operations. eg. `.checked_add(...)`
# or `.saturating_sub(...)` to avoid unexpected runtime behavior or panics.
arithmetic_side_effects = "deny"

## lints related to readability of code
# enforce that references are cloned via eg. `Arc::clone` instead of `.clone()`
# making it explicit that a reference is cloned here and not the underlying data.
clone_on_ref_ptr = "warn"
# enforce that the type suffix of a literal is always appended directly
# eg. 12u8 instead of 12_u8
separated_literal_suffix = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }

[profile.release.package."*"]
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true

# Required because cda-database is built against a custom flatbuffers fork that
# adds TaggedUnion, BuildVector, UnionVectorWIPOffsets, and UnionVerifiable which
# are not present in the upstream 25.x registry releases.
[patch.crates-io]
flatbuffers = { git = "https://github.com/alexmohr/flatbuffers.git", rev = "0ba3307d" }
