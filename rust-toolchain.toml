# Pins the Rust stable toolchain to the version validated and qualified in CI.
# rustup reads this file automatically; any `cargo` command in the workspace will
# use this toolchain without requiring an explicit `+1.88.0` override.
#
# Safety-critical context: toolchain qualification evidence produced by CI
# (build, test, clippy, deny) is only valid against this exact compiler version.
# Upgrading this version requires re-running the full CI matrix and reviewing
# any new clippy diagnostics before merging.
#
# NIGHTLY (for `cargo +nightly fmt` only):
#   The nightly toolchain is NOT pinned here because it is only used for
#   nightly-only rustfmt options. Install it separately when needed:
#
#     rustup toolchain install nightly-2025-07-14 --component rustfmt
#
#   The pinned nightly date matches the one used in the PR lint workflow
#   (.github/workflows/pr-checks.yml). Update both together.

[toolchain]
channel = "1.88.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
