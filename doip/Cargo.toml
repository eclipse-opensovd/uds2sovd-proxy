[package]
name = "doip"
version.workspace = true
edition.workspace = true
publish = false
description = "ISO 13400-2 DoIP transport layer: TCP server, connection handler, routing activation, and UDS dispatch."
homepage.workspace = true
license.workspace = true

[dependencies]
uds = { workspace = true }
# Async networking and synchronisation.
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
# Zero-copy byte buffers for protocol framing.
bytes = { workspace = true, features = ["std"] }
# Structured logging.
tracing = { workspace = true, features = ["std"] }
# Async trait object support for PayloadHandler.
async-trait = { workspace = true }
# Config deserialization (ServerConfig / DoipConnectionConfig).
serde = { workspace = true, features = ["std", "derive"] }

[dev-dependencies]

[lints]
workspace = true
