[package]
name        = "uds2sovd-proxy"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
description = "UDS-to-SOVD Proxy - composition of DoIP Server, UDS-to-SOVD Translation and SOVD proxy"

[[bin]]
name = "uds2sovd-proxy"
path = "main.rs"

[dependencies]
uds2sovd_proxy_lib = { path = "../src", package = "uds2sovd-proxy-lib" }
tokio              = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "signal"] }
tracing            = "0.1"
tracing-subscriber = "0.3"
