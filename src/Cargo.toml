[package]
name = "uds2sovd-proxy-lib"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "UDS-to-SOVD Proxy library - DoIP Server, Translation, and SOVD Proxy"

[dependencies]
tokio              = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "signal"] }
serde              = { version = "1", features = ["derive"] }
toml               = "0.8"
uuid               = { version = "1", features = ["v4"] }
tracing            = "0.1"
tracing-subscriber = "0.3"
thiserror          = "2"

[lib]
name = "uds2sovd_proxy_lib"
path = "lib.rs"
