[package]
name = "uds"
version.workspace = true
edition.workspace = true
publish = false
description = "UDS protocol primitives: error types, Nrc, DiagHandler trait, and UDS SID constants.  Zero heavy dependencies — safe to embed in any DoIP or SOVD crate."
homepage.workspace = true
license.workspace = true

[dependencies]
# Error derive macros only — no async runtime, no CDA, no network.
thiserror = { workspace = true, features = ["std"] }
# Object-safe async trait for DiagHandler.
async-trait = { workspace = true }

[dev-dependencies]
# Minimal async runtime for unit tests only — not a production dependency.
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
